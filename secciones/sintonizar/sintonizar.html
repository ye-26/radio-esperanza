<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Esperanza - Sintonizar en Vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /*Estilos Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: transparent;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }

    .player-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Encabezado */
    .main-title {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .main-subtitle {
      font-size: 0.9rem;
      color: #9090ab;
      text-align: center;
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* Contenedor*/
    .widget-wrapper {
      position: relative;
      width: 100%;
      background: #121022;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      min-height: 250px; 
    }

    .clock-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 60%;
      height: 55px;
      background: #7a00e6;
      border-top-right-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.1rem;
      z-index: 999; 
      box-shadow: 2px -2px 15px rgba(122, 0, 230, 0.4);
    }

    .clock-overlay span {
      pointer-events: none; 
    }

    .footer-text {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #6a6a82;
      text-align: center;
    }

    .cstrEmbed a {
      display: none;
    }
  </style>
</head>
<body>

  <div class="player-container">
    
    <!-- Título -->
    <h1 class="main-title">Radio Esperanza</h1>
    <p class="main-subtitle">Haz clic en PLAY para sintonizar nuestra señal digital en vivo</p>

    <!-- Contenedor del reproductor -->
    <div class="widget-wrapper">
      
      <!-- WIDGET -->
      <div data-type="newStreamPlayer" data-publicToken="c77b0829-2cab-4c7e-8644-4ff95792c3be" data-theme="dark" data-color="00FF4a" data-channelId="" data-rendered="false" class="cstrEmbed">
        <a href="https://www.caster.fm">Shoutcast Hosting</a> 
        <a href="https://www.caster.fm">Stream Hosting</a> 
        <a href="https://www.caster.fm">Radio Server Hosting</a>
      </div>
      <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>

      <!-- Reloj sobrepuesto -->
      <div class="clock-overlay">
        <span>⏰</span>
        <span id="live-clock">--:--</span>
      </div>

    </div>

    <!-- Pie de página -->
    <p class="footer-text">© 2026 Radio Esperanza. Todos los derechos reservados.</p>
  </div>

  <!-- SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const liveClock = document.getElementById('live-clock');

      function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        
        hours = hours % 12;
        hours = hours ? hours : 12; 
        
        liveClock.textContent = `${hours}:${minutes} ${ampm}`;
      }
      
      updateClock();
      setInterval(updateClock, 1000);
    });
  </script>
</body>
</html>
