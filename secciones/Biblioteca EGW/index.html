<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071321">
<meta name="description" content="Biblioteca digital de Radio Esperanza: libros para consultar y leer.">
<title>Biblioteca EGW · Radio Esperanza</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/biblioteca.css?v=20261112-true-transparent">
<link rel="stylesheet" href="css/lector.css?v=20261112-true-transparent">
</head>
<body>
<main class="library-shell" id="libraryShell">
<header class="topbar"><div class="brand" aria-label="Biblioteca EGW"><span class="brand-mark"><img src="icons/icon.svg" alt="" aria-hidden="true"></span><span class="brand-name">EGW</span></div><button id="searchToggle" class="circle-control search-toggle" aria-label="Abrir búsqueda" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button><section class="search-panel" id="searchPanel" hidden><form id="searchForm" role="search"><label class="sr-only" for="searchInput">Buscar libros, autores o temas</label><input id="searchInput" type="search" placeholder="Título, autor o tema…" autocomplete="off"><button class="search-submit" type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button><button class="search-clear" id="searchClear" type="button" aria-label="Limpiar búsqueda">×</button></form><div class="suggestions" id="suggestions" role="listbox" hidden></div></section></header>
<section class="intro"><div><h1>Biblioteca <span>EGW</span></h1><p class="intro-copy">Explora una colección de libros que te serán de apollo en tu crecimiento espíritual, además, podras descargar libros para leer cuando no tengas conexión a internet.</p></div></section>

<section class="catalog-tools" aria-label="Filtros del catálogo"><div class="category-list" id="categoryList"></div><div class="tool-selects"><label class="sr-only" for="authorFilter">Filtrar por autor</label><select id="authorFilter"><option value="">Todos los autores</option></select><label class="sr-only" for="sortSelect">Ordenar catálogo</label><select id="sortSelect"><option value="title">Título A–Z</option><option value="author">Autor A–Z</option></select></div></section>
<section class="results-heading"><div><h2 id="resultsTitle">Todos los libros</h2><p id="resultsCount" aria-live="polite">Cargando biblioteca…</p></div><button class="text-button" id="resetFilters" type="button">Restablecer</button></section>
<div class="status-message" id="statusMessage" role="status" hidden></div><section class="book-grid" id="bookGrid" aria-label="Catálogo de libros"></section><div class="pagination"><button class="load-more" id="loadMore" type="button" hidden>Mostrar más libros</button></div>
<footer class="library-footer">Biblioteca EGW <span>·</span> Radio Esperanza</footer>
</main>
<section class="reader" id="reader" aria-label="Lector de libros PDF" aria-hidden="true" hidden>
<header class="reader-header"><button class="circle-control reader-close" id="readerClose" aria-label="Cerrar lector"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div class="reader-book"><strong id="readerTitle">Libro</strong><span id="readerStatus" aria-live="polite">Preparando documento…</span></div></header>
<div class="reader-progress"><span id="pageProgress"></span></div>
<div class="reader-stage" id="readerStage"><div class="page-wrap"><canvas id="pdfCanvas" aria-label="Página del documento PDF"></canvas></div><div class="reader-error" id="readerError" role="alert" hidden></div></div>
<label class="page-indicator" id="pageIndicator" aria-label="Navegación por página"><span class="page-label">PÁGINA</span><input id="pageInput" type="number" min="1" value="1" inputmode="numeric" aria-label="Ir directamente a la página" title="Escribe un número para saltar a esa página"><span>/</span><span id="totalPages">—</span></label>
<nav class="floating-controls" id="floatingControls" aria-label="Controles principales del lector"><button class="circle-control" id="zoomOut" aria-label="Disminuir zoom" title="Disminuir zoom"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5M8 10.8h5.6"/></svg></button><button class="circle-control" id="zoomIn" aria-label="Aumentar zoom" title="Aumentar zoom"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5M8 10.8h5.6m-2.8-2.8v5.6"/></svg></button><button class="circle-control" id="previousPage" aria-label="Página anterior" title="Página anterior"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="circle-control" id="nextPage" aria-label="Página siguiente" title="Página siguiente"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><button class="circle-control more-control" id="moreButton" aria-label="Más controles" title="Más controles" aria-expanded="false" aria-controls="readerMoreTray"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></nav>
<div class="reader-more-tray" id="readerMoreTray" aria-label="Más controles del lector" hidden><button class="circle-control" id="downloadPdf" aria-label="Descargar PDF" title="Descargar PDF"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg></button><button class="circle-control" id="fullscreenButton" aria-label="Pantalla completa" title="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg></button><button class="circle-control" id="orientationButton" aria-label="Solicitar orientación horizontal" title="Orientación horizontal"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 10h8"/></svg></button></div>
</section>
<script type="module" src="js/biblioteca.js?v=20261112-true-transparent"></script>
</body>
</html>
