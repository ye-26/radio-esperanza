<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171321">
  <title>Recursos Bíblicos - Radio Esperanza</title>
  <style>
    :root {
      --bg-color: transparent;
      --card-border: rgba(255, 255, 255, .08);
      --primary: #9c27b0;
      --primary-light: #b388ff;
      --primary-hover: rgba(144, 0, 255, .25);
      --text-main: #fff;
      --text-muted: #a0a0a0;
      --btn-border: rgba(255, 255, 255, .2);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html { overflow-x: clip; }
    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 20px 20px;
      overflow-x: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible, .cat-card:focus-visible {
      outline: 2px solid var(--primary-light);
      outline-offset: 3px;
    }
    .header-app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 26px;
      text-align: center;
    }
    .header-app h1 {
      margin: 0 0 8px;
      font-size: clamp(1.45rem, 5vw, 1.8rem);
      line-height: 1.2;
    }
    .header-app p {
      margin: 0;
      color: var(--primary-light);
      font-size: .95rem;
    }
    #app {
      width: 100%;
      max-width: 600px;
      min-width: 0;
      margin: 0 auto;
    }
    .card {
      min-width: 0;
      margin-bottom: 14px;
      padding: 18px;
      background: transparent;
      border: 1px solid var(--card-border);
      border-top-color: rgba(255,255,255,.15);
      border-radius: 12px;
      transition: transform .2s ease, background .3s ease;
    }
    .cat-card {
      cursor: pointer;
      text-align: left;
    }
    .cat-card:hover {
      background: rgba(255,255,255,.03);
      transform: translateY(-2px);
    }
    .cat-icono {
      display: block;
      margin-bottom: 9px;
      font-size: 2rem;
      line-height: 1.1;
    }
    .cat-titulo {
      margin: 0 0 5px;
      font-size: 1.15rem;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .cat-desc {
      margin: 0 0 10px;
      color: var(--text-muted);
      font-size: .9rem;
      line-height: 1.45;
    }
    .cat-count {
      color: var(--primary-light);
      font-size: .8rem;
      font-weight: 600;
    }
    .btn-volver {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 9px 14px;
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      color: var(--text-main);
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
    }
    .btn-volver:hover {
      background: rgba(255,255,255,.1);
    }
    .header-categoria {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      margin-bottom: 18px;
    }
    .header-categoria .cat-icono {
      flex: 0 0 auto;
      margin: 0;
      font-size: 1.8rem;
    }
    .header-categoria h2 {
      margin: 0;
      font-size: 1.3rem;
      overflow-wrap: anywhere;
    }
    .header-categoria p {
      margin: 5px 0 0;
      color: var(--text-muted);
      font-size: .88rem;
      line-height: 1.4;
    }
    .recurso-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px;
    }
    .recurso-info {
      flex: 1 1 auto;
      min-width: 0;
    }
    .recurso-titulo {
      margin-bottom: 7px;
      font-size: .98rem;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
      text-transform: uppercase;
    }
    .recurso-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: .77rem;
    }
    .badge-tipo {
      padding: 3px 7px;
      border: 1px solid var(--btn-border);
      border-radius: 4px;
      color: var(--primary-light);
      background: rgba(255,255,255,.05);
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .btn-abrir {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 88px;
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid rgba(144,0,255,.4);
      border-radius: 7px;
      color: var(--text-main);
      background: rgba(144,0,255,.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      font-weight: 600;
    }
    .btn-abrir:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 0 12px rgba(144,0,255,.3);
    }
    .btn-abrir:disabled {
      opacity: .55;
      cursor: wait;
    }

    #visor-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(0,0,0,.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .visor-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(15,12,22,.72);
    }
    .visor-titulo {
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .95rem;
      font-weight: 600;
    }
    .visor-acciones {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
    }
    .btn-visor {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 7px;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: .83rem;
      font-weight: 600;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .btn-descargar {
      border: 1px solid rgba(156,39,176,.5);
      background: rgba(156,39,176,.2);
    }
    .btn-cerrar {
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.05);
    }
    .visor-body {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      justify-content: center;
      align-items: center;
      min-height: 0;
      overflow: auto;
      padding: 8px;
    }
    .pdf-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      background: rgba(23,19,33,.62);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
    }
    .pdf-toolbar[hidden] { display: none; }
    .pdf-toolbar button, .pdf-toolbar input {
      min-height: 36px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 9px;
      color: #fff;
      background: rgba(255,255,255,.08);
      font: inherit;
    }
    .pdf-toolbar button { min-width: 40px; padding: 6px 11px; cursor: pointer; }
    .pdf-toolbar button:hover:not(:disabled) { background: rgba(156,39,176,.35); }
    .pdf-toolbar button:disabled { opacity: .4; cursor: default; }
    .pdf-toolbar input { width: 54px; padding: 5px; text-align: center; }
    .pdf-page-label { color: rgba(255,255,255,.78); font-size: .82rem; }
    .pdf-canvas-wrap {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      min-height: 100%;
      padding: 8px;
      overflow: auto;
    }
    .pdf-canvas-wrap canvas {
      display: block;
      max-width: none;
      flex: 0 0 auto;
      height: auto;
      border-radius: 4px;
      background: white;
      box-shadow: 0 18px 55px rgba(0,0,0,.38);
    }
    .pdf-loading { color: rgba(255,255,255,.8); text-align: center; }
    .visor-body iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      border-radius: 8px;
      background: white;
    }
    .visor-body img,
    .visor-body video {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .visor-body audio {
      width: 100%;
      max-width: 440px;
    }
    .mensaje-error {
      padding: 20px;
      border-radius: 8px;
      color: #ffaaa2;
      background: rgba(255,0,0,.1);
      text-align: center;
      line-height: 1.5;
    }
    .mensaje-estado {
      padding: 36px 18px;
      color: var(--text-muted);
      text-align: center;
    }
    footer {
      width: 100%;
      max-width: 600px;
      margin: 28px auto 0;
      color: var(--text-muted);
      font-size: .8rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 22px 14px calc(18px + env(safe-area-inset-bottom));
      }
      .header-app {
        margin-bottom: 22px;
      }
      .card {
        padding: 15px;
      }
      .recurso-card {
        align-items: center;
        gap: 10px;
        padding: 12px;
      }
      .recurso-titulo {
        font-size: .9rem;
      }
      .btn-abrir {
        min-width: 78px;
        min-height: 40px;
        padding: 8px 10px;
      }
      #visor-modal {
        background: rgba(0,0,0,.52);
      }
      .visor-header {
        gap: 8px;
        padding: 8px 10px;
      }
      .visor-titulo {
        font-size: .83rem;
      }
      .btn-visor {
        min-height: 40px;
        padding: 8px 10px;
        font-size: .78rem;
      }
      .visor-body {
        padding: 0;
      }
      .pdf-toolbar { gap: 6px; padding: 7px 6px; }
      .pdf-toolbar button { min-width: 36px; padding: 5px 8px; }
      .pdf-canvas-wrap { padding: 4px; }
      .visor-body iframe {
        border-radius: 0;
      }
    }

    @media (max-width: 360px) {
      body {
        padding-right: 10px;
        padding-left: 10px;
      }
      .visor-header {
        flex-wrap: wrap;
      }
      .visor-titulo {
        flex-basis: 100%;
      }
      .visor-acciones {
        width: 100%;
      }
      .visor-acciones .btn-visor {
        flex: 1;
      }
      .recurso-card {
        align-items: stretch;
        flex-direction: column;
      }
      .btn-abrir {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="header-app">
    <h1>Recursos Bíblicos</h1>
    <p>Selecciona una categoría para explorar el material</p>
  </header>

  <main id="app" aria-live="polite">
    <div class="mensaje-estado">Cargando catálogo...</div>
  </main>

  <footer>
    &copy; 2026 Radio Esperanza. Todos los derechos reservados.
  </footer>

  <section id="visor-modal" role="dialog" aria-modal="true" aria-label="Visor de recursos" aria-hidden="true">
    <header class="visor-header">
      <div class="visor-titulo" id="visor-titulo">Nombre del archivo</div>
      <div class="visor-acciones">
        <a href="#" id="btn-visor-descargar" class="btn-visor btn-descargar" download>⬇ Descargar</a>
        <button id="btn-visor-cerrar" class="btn-visor btn-cerrar" type="button">✕ Cerrar</button>
      </div>
    </header>

    <nav class="pdf-toolbar" id="pdf-toolbar" aria-label="Controles del visor PDF" hidden>
      <button type="button" id="pdf-prev" aria-label="Página anterior">‹</button>
      <input id="pdf-page" type="number" min="1" value="1" aria-label="Número de página">
      <span class="pdf-page-label">de <span id="pdf-total">—</span></span>
      <button type="button" id="pdf-next" aria-label="Página siguiente">›</button>
      <button type="button" id="pdf-zoom-out" aria-label="Reducir zoom">−</button>
      <span class="pdf-page-label" id="pdf-zoom-label">100%</span>
      <button type="button" id="pdf-zoom-in" aria-label="Aumentar zoom">+</button>
    </nav>

    <div class="visor-body" id="visor-body"></div>
  </section>

  <script>
    (() => {
      const memoria = {
        categorias: new Map(),
        blobs: new Map()
      };

      const app = document.getElementById('app');
      const modal = document.getElementById('visor-modal');
      const visorBody = document.getElementById('visor-body');
      const visorTitulo = document.getElementById('visor-titulo');
      const descargar = document.getElementById('btn-visor-descargar');
      const pdfToolbar = document.getElementById('pdf-toolbar');
      const pdfPageInput = document.getElementById('pdf-page');
      const pdfTotal = document.getElementById('pdf-total');
      const pdfZoomLabel = document.getElementById('pdf-zoom-label');

      let pdfDocument = null;
      let pdfPageNumber = 1;
      let pdfScale = 1;
      let pdfRenderTask = null;
      let pdfLoadToken = 0;
      let pdfLibraryPromise = null;
      const PDFJS_VERSION = '3.11.174';

      let urlTemporalActual = null;
      let focoAnterior = null;

      function escapar(valor) {
        const mapa = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };

        return String(valor ?? '').replace(/[&<>"']/g, c => mapa[c]);
      }

      function rutaSegura(ruta) {
        const texto = String(ruta || '').trim();

        if (!texto || /^(?:[a-z]+:|\/\/|\\\\)/i.test(texto)) {
          throw new Error('La ruta del recurso no es válida.');
        }

        return texto
          .split('/')
          .map(parte => encodeURIComponent(decodeURIComponent(parte)))
          .join('/');
      }

      async function init() {
        app.innerHTML = '<div class="mensaje-estado">Cargando catálogo...</div>';

        try {
          const res = await fetch('recursos/recursos.json');

          if (!res.ok) {
            throw new Error('No se pudo cargar el índice.');
          }

          const data = await res.json();
          renderCategorias(data.categorias);
        } catch (error) {
          app.innerHTML = `
            <div class="mensaje-error">
              ⚠️ No se pudo cargar el catálogo. Verifica que
              recursos/recursos.json exista y vuelve a intentarlo.
            </div>
            <div class="mensaje-estado">
              <button class="btn-volver" id="btn-reintentar">Reintentar</button>
            </div>
          `;

          document.getElementById('btn-reintentar').addEventListener('click', init);
        }
      }

      function renderCategorias(categorias) {
        if (!Array.isArray(categorias) || categorias.length === 0) {
          app.innerHTML = '<div class="mensaje-estado">No hay categorías disponibles.</div>';
          return;
        }

        app.innerHTML = categorias.map((cat, i) => `
          <article
            class="card cat-card"
            tabindex="0"
            role="button"
            data-cat-index="${i}"
            aria-label="Abrir categoría ${escapar(cat.nombre)}"
          >
            <span class="cat-icono" aria-hidden="true">${escapar(cat.icono || '📄')}</span>
            <h2 class="cat-titulo">${escapar(cat.nombre)}</h2>
            <p class="cat-desc">${escapar(cat.descripcion || '')}</p>
            <span class="cat-count">${Number(cat.cantidad) || 0} recursos</span>
          </article>
        `).join('');

        app.querySelectorAll('[data-cat-index]').forEach(card => {
          const activar = () => {
            const cat = categorias[Number(card.dataset.catIndex)];
            cargarCategoria(cat.id, cat.archivoJson);
          };

          card.addEventListener('click', activar);

          card.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              activar();
            }
          });
        });
      }

      async function cargarCategoria(id, archivoJson) {
        app.innerHTML = '<div class="mensaje-estado">⏳ Cargando recursos...</div>';

        try {
          let data = memoria.categorias.get(id);

          if (!data) {
            const res = await fetch(rutaSegura(archivoJson));

            if (!res.ok) {
              throw new Error('No se pudo cargar el JSON de la categoría.');
            }

            data = await res.json();
            memoria.categorias.set(id, data);
          }

          renderRecursos(data);
        } catch (error) {
          app.innerHTML = `
            <button class="btn-volver" id="volver-error">← Volver a categorías</button>
            <div class="mensaje-error">
              ⚠️ No se pudieron cargar los recursos de esta categoría.
              Comprueba la ruta de su archivo JSON.
            </div>
          `;

          document.getElementById('volver-error').addEventListener('click', init);
        }
      }

      function renderRecursos(data) {
        const archivos = Array.isArray(data.archivos) ? data.archivos : [];

        app.innerHTML = `
          <button class="btn-volver" id="btn-volver" type="button">
            ← Volver a categorías
          </button>

          <section class="header-categoria">
            <span class="cat-icono" aria-hidden="true">${escapar(data.icono || '📄')}</span>
            <div>
              <h2>${escapar(data.nombre || 'Categoría')}</h2>
              <p>${escapar(data.descripcion || '')}</p>
            </div>
          </section>

          <section class="lista-recursos" aria-label="Recursos de la categoría">
            ${
              archivos.length
                ? archivos.map((rec, i) => `
                  <article class="card recurso-card">
                    <div class="recurso-info">
                      <div class="recurso-titulo">${escapar(rec.nombre || rec.archivo)}</div>

                      <div class="recurso-meta">
                        <span class="badge-tipo">${escapar(rec.tipo || 'archivo')}</span>
                        ${rec.tamano ? `<span>· ${escapar(rec.tamano)}</span>` : ''}
                      </div>

                      ${rec.descripcion ? `<p class="cat-desc">${escapar(rec.descripcion)}</p>` : ''}
                    </div>

                    <button class="btn-abrir" type="button" data-file-index="${i}">
                      📖 Abrir
                    </button>
                  </article>
                `).join('')
                : '<div class="mensaje-estado">Esta categoría aún no tiene recursos.</div>'
            }
          </section>
        `;

        document.getElementById('btn-volver').addEventListener('click', init);

        app.querySelectorAll('[data-file-index]').forEach(button => {
          button.addEventListener('click', () => {
            gestionarRecurso(button, data, archivos[Number(button.dataset.fileIndex)]);
          });
        });
      }

      function esAndroid() {
        return /Android/i.test(navigator.userAgent);
      }

      async function gestionarRecurso(button, categoria, recurso) {
        const nombre = recurso.archivo;
        let ruta;

        try {
          ruta = rutaSegura(`${categoria.carpetaBase}/${nombre}`);
          const tipo = String(recurso.tipo || '').toLowerCase();

          button.disabled = true;
          button.textContent = '⏳ Cargando...';

          let blob = memoria.blobs.get(ruta);

          if (!blob) {
            const response = await fetch(ruta);

            if (!response.ok) {
              throw new Error('No se encontró el archivo.');
            }

            blob = await response.blob();
            memoria.blobs.set(ruta, blob);
          }

          if (urlTemporalActual) {
            URL.revokeObjectURL(urlTemporalActual);
          }

          urlTemporalActual = URL.createObjectURL(blob);
          abrirVisor(urlTemporalActual, nombre, tipo, recurso.nombre || nombre, blob);
        } catch (error) {
          alert(`No se pudo abrir "${nombre}". Comprueba que el archivo exista en su carpeta.`);
        } finally {
          button.disabled = false;
          button.innerHTML = '📖 Abrir';
        }
      }

      function abrirVisor(url, archivo, tipo, titulo, blob) {
        visorTitulo.textContent = titulo;
        descargar.href = url;
        descargar.download = archivo;

        visorBody.replaceChildren();
        pdfToolbar.hidden = true;
        pdfDocument = null;
        if (pdfRenderTask) { pdfRenderTask.cancel(); pdfRenderTask = null; }

        const t = tipo.toLowerCase();
        let elemento;

        if (t === 'pdf') {
          pdfToolbar.hidden = false;
          elemento = document.createElement('div');
          elemento.className = 'pdf-canvas-wrap';
          elemento.innerHTML = '<p class="pdf-loading" role="status">Preparando el visor PDF…</p>';

        } else if (['imagen', 'img', 'jpg', 'jpeg', 'png', 'webp', 'gif'].includes(t)) {
          elemento = document.createElement('img');
          elemento.src = url;
          elemento.alt = titulo;

        } else if (['audio', 'mp3', 'ogg', 'wav', 'm4a'].includes(t)) {
          elemento = document.createElement('audio');
          elemento.src = url;
          elemento.controls = true;
          elemento.autoplay = true;

        } else if (['video', 'mp4', 'webm', 'ogv'].includes(t)) {
          elemento = document.createElement('video');
          elemento.src = url;
          elemento.controls = true;
          elemento.autoplay = true;
          elemento.playsInline = true;

        } else if (t === 'html') {
          elemento = document.createElement('iframe');
          elemento.title = 'Vista previa HTML';
          elemento.src = url;
          elemento.setAttribute('sandbox', 'allow-scripts');

        } else {
          const mensaje = document.createElement('div');
          mensaje.className = 'mensaje-error';
          mensaje.innerHTML = `
            <h3>Vista previa no disponible</h3>
            <p>Este formato no se puede mostrar aquí. Usa “Descargar” para guardar el archivo.</p>
          `;
          elemento = mensaje;
        }

        visorBody.append(elemento);

        focoAnterior = document.activeElement;
        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden', 'false');

        document.getElementById('btn-visor-cerrar').focus();
        document.body.style.overflow = 'hidden';
        if (t === 'pdf') cargarPdf(blob);
      }

      function cargarPdfJs() {
        if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
        if (pdfLibraryPromise) return pdfLibraryPromise;

        pdfLibraryPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js`;
          script.crossOrigin = 'anonymous';
          script.onload = () => {
            if (!window.pdfjsLib) return reject(new Error('No se pudo iniciar PDF.js.'));
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;
            resolve(window.pdfjsLib);
          };
          script.onerror = () => reject(new Error('No se pudo cargar el motor del visor PDF.'));
          document.head.appendChild(script);
        });
        return pdfLibraryPromise;
      }

      async function cargarPdf(blob) {
        const token = ++pdfLoadToken;
        const wrap = visorBody.querySelector('.pdf-canvas-wrap');
        if (!wrap) return;
        try {
          const pdfjs = await cargarPdfJs();
          const bytes = await blob.arrayBuffer();
          const documento = await pdfjs.getDocument({ data: new Uint8Array(bytes) }).promise;
          if (token !== pdfLoadToken || modal.getAttribute('aria-hidden') === 'true') return;
          pdfDocument = documento;
          pdfPageNumber = 1;
          pdfScale = 1;
          pdfTotal.textContent = String(documento.numPages);
          pdfPageInput.max = String(documento.numPages);
          await dibujarPagina(token);
        } catch (error) {
          if (token !== pdfLoadToken || modal.getAttribute('aria-hidden') === 'true') return;
          wrap.replaceChildren();
          const mensaje = document.createElement('div');
          mensaje.className = 'mensaje-error';
          mensaje.textContent = 'No se pudo mostrar este PDF. Comprueba que el archivo sea válido y que haya conexión para cargar el visor.';
          wrap.append(mensaje);
        }
      }

      async function dibujarPagina(token = pdfLoadToken) {
        if (!pdfDocument) return;
        if (pdfRenderTask) { pdfRenderTask.cancel(); pdfRenderTask = null; }
        const pagina = await pdfDocument.getPage(pdfPageNumber);
        if (token !== pdfLoadToken || modal.getAttribute('aria-hidden') === 'true') return;
        const wrap = visorBody.querySelector('.pdf-canvas-wrap');
        if (!wrap) return;
        const viewportBase = pagina.getViewport({ scale: 1 });
        const anchoDisponible = Math.max(240, wrap.clientWidth - 24);
        const escalaAjustada = Math.min(anchoDisponible / viewportBase.width, 1.5) * pdfScale;
        const viewport = pagina.getViewport({ scale: escalaAjustada });
        const canvas = document.createElement('canvas');
        const contexto = canvas.getContext('2d', { alpha: false });
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(viewport.width * pixelRatio);
        canvas.height = Math.floor(viewport.height * pixelRatio);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;
        wrap.replaceChildren(canvas);
        pdfPageInput.value = String(pdfPageNumber);
        pdfZoomLabel.textContent = `${Math.round(escalaAjustada * 100)}%`;
        document.getElementById('pdf-prev').disabled = pdfPageNumber <= 1;
        document.getElementById('pdf-next').disabled = pdfPageNumber >= pdfDocument.numPages;
        pdfRenderTask = pagina.render({ canvasContext: contexto, viewport, transform: pixelRatio === 1 ? null : [pixelRatio, 0, 0, pixelRatio, 0, 0] });
        try { await pdfRenderTask.promise; } catch (error) { if (error.name !== 'RenderingCancelledException') throw error; }
        if (token === pdfLoadToken) pdfRenderTask = null;
      }

      document.getElementById('pdf-prev').addEventListener('click', () => { if (pdfDocument && pdfPageNumber > 1) { pdfPageNumber--; dibujarPagina(); } });
      document.getElementById('pdf-next').addEventListener('click', () => { if (pdfDocument && pdfPageNumber < pdfDocument.numPages) { pdfPageNumber++; dibujarPagina(); } });
      document.getElementById('pdf-zoom-in').addEventListener('click', () => { pdfScale = Math.min(2.5, pdfScale + .2); dibujarPagina(); });
      document.getElementById('pdf-zoom-out').addEventListener('click', () => { pdfScale = Math.max(.6, pdfScale - .2); dibujarPagina(); });
      pdfPageInput.addEventListener('change', () => {
        if (!pdfDocument) return;
        pdfPageNumber = Math.min(pdfDocument.numPages, Math.max(1, Number(pdfPageInput.value) || 1));
        dibujarPagina();
      });

      function cerrarVisor() {
        pdfLoadToken++;
        if (pdfRenderTask) { pdfRenderTask.cancel(); pdfRenderTask = null; }
        pdfDocument = null;
        pdfToolbar.hidden = true;
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
        visorBody.replaceChildren();

        if (urlTemporalActual) {
          URL.revokeObjectURL(urlTemporalActual);
          urlTemporalActual = null;
        }

        descargar.removeAttribute('href');
        document.body.style.overflow = '';

        if (focoAnterior && focoAnterior.focus) {
          focoAnterior.focus();
        }
      }

      document.getElementById('btn-visor-cerrar').addEventListener('click', cerrarVisor);

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && modal.style.display === 'flex') {
          cerrarVisor();
        }
      });

      init();
    })();
  </script>
</body>
</html>
