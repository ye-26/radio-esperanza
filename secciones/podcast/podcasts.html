<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcasts - Radio Esperanza</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-user-drag: none !important;
    }
    :root {
      --pd-primary: #9000FF;
      --pd-accent: #c893ff;
      --pd-card-bg: rgba(20, 20, 30, 0.65);
      --pd-glass-border: rgba(255, 255, 255, 0.15);
      --pd-glass-glow: rgba(144, 0, 255, 0.25);
      --pd-text: #ffffff;
      --pd-text-muted: #a0a0c0;
      --pd-border: rgba(144, 0, 255, 0.25);
      --pd-radius: 16px;
    }
    body {
      margin: 0; padding: 20px;
      background-color: transparent;
      font-family: system-ui, sans-serif;
      color: var(--pd-text); overflow-x: hidden;
    }
    #radio-esperanza-podcasts { width: 100%; max-width: 620px; margin: 0 auto; }
    .pd-loading, .pd-error { text-align: center; padding: 30px; border-radius: var(--pd-radius); }
    .pd-loading { color: var(--pd-text-muted); }
    .pd-error { background: rgba(255,0,0,0.1); color: #ff6b6b; border: 1px dashed #ff6b6b; }
    .pd-proximamente {
      text-align: center; padding: 40px 20px; background: var(--pd-card-bg);
      border-radius: var(--pd-radius); border: 1px dashed var(--pd-border);
    }
    .pd-prox-icon { font-size: 50px; margin-bottom: 10px; }
    .pd-proximamente h2 { color: var(--pd-primary); margin: 0 0 10px 0; font-size: 1.4rem; }
    .pd-proximamente p { color: var(--pd-text-muted); font-size: 0.95rem; margin: 0; }
    .pd-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .pd-card {
      background: var(--pd-card-bg); border-radius: var(--pd-radius); overflow: hidden;
      border: 1px solid var(--pd-border); display: flex; flex-direction: column;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }
    .pd-card-img-container { position: relative; width: 100%; height: 220px; background-color: #1a162b; }
    .pd-card-img { width: 100%; height: 100%; object-fit: cover; }
    .pd-badge {
      position: absolute; bottom: 12px; right: 15px; background: var(--pd-primary); color: #fff;
      padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: bold;
      box-shadow: 0 2px 8px rgba(144, 0, 255, 0.5);
    }
    .pd-card-content { padding: 20px 15px 15px 15px; text-align: center; }
    .pd-card-title { font-size: 1.3rem; color: var(--pd-accent); margin: 0 0 5px 0; font-weight: bold; }
    .pd-card-desc { color: var(--pd-text-muted); font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }
    .pd-card-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: #8a8aab; margin-bottom: 15px; padding: 0 5px; }
    .pd-btn {
      display: block; width: 100%; background: rgba(144, 0, 255, 0.12); color: var(--pd-text);
      padding: 12px; text-align: center; border-radius: 10px; border: 1px solid var(--pd-primary);
      cursor: pointer; font-weight: bold; transition: all 0.3s ease;
    }
    .pd-btn:hover { background: var(--pd-primary); box-shadow: 0 0 15px var(--pd-primary); }
    .pd-back-btn {
      background: none; border: none; color: var(--pd-accent); cursor: pointer;
      margin-bottom: 20px; font-size: 0.95rem; font-weight: bold; padding: 0; display: flex; align-items: center; gap: 5px;
    }
    .pd-back-btn:hover { text-decoration: underline; }
    .pd-header { text-align: center; margin-bottom: 25px; }
    .pd-header-img { 
      width: 160px; height: 50px; object-fit: cover; border-radius: 25px; 
      border: 2px solid var(--pd-primary); margin: 0 auto 15px auto; display: block;
      box-shadow: 0 4px 20px rgba(144, 0, 255, 0.4); 
    }
    .pd-header h1 { font-size: 1.6rem; color: var(--pd-text); margin: 0 0 8px 0; }
    .pd-header-desc { font-size: 0.85rem; color: var(--pd-text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; }
    .pd-header-meta { font-size: 0.85rem; color: var(--pd-accent); }
    .pd-episodes-title { 
      font-size: 1.1rem; color: var(--pd-primary); border-bottom: 1px solid var(--pd-border); 
      padding-bottom: 10px; margin-bottom: 15px; font-weight: bold;
    }
    .pd-episode { 
      background: var(--pd-card-bg); padding: 18px; border-radius: 12px; 
      border-left: 4px solid var(--pd-primary); margin-bottom: 18px; 
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .pd-ep-info { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .pd-ep-title { font-size: 1.1rem; color: var(--pd-accent); margin: 0; font-weight: bold; }
    .pd-ep-date { font-size: 0.8rem; color: #8a8aab; }
    .pd-ep-desc { color: var(--pd-text-muted); font-size: 0.85rem; margin: 0 0 15px 0; line-height: 1.4; }
    .pd-liquid-player {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--pd-glass-border);
      border-radius: 14px; padding: 14px;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 8px 24px var(--pd-glass-glow);
      display: flex; flex-direction: column; gap: 10px;
    }
    .pd-player-controls { display: flex; align-items: center; justify-content: center; gap: 15px; }
    .pd-glass-btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255,255,255,0.2);
      color: #ffffff; border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 0.9rem; transition: all 0.2s ease; backdrop-filter: blur(5px);
    }
    .pd-glass-btn:hover {
      background: rgba(144, 0, 255, 0.4); border-color: var(--pd-accent);
      box-shadow: 0 0 12px var(--pd-primary); transform: scale(1.05);
    }
    .pd-glass-btn-play {
      width: 46px; height: 46px; font-size: 1.2rem; background: rgba(144, 0, 255, 0.3);
      border: 1px solid var(--pd-accent); box-shadow: 0 0 15px rgba(144,0,255,0.4);
    }
    .pd-progress-container { display: flex; align-items: center; gap: 10px; }
    .pd-time-display { font-size: 0.75rem; color: var(--pd-accent); font-weight: 600; min-width: 40px; text-align: center; }
    .pd-slider {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px;
      background: rgba(255, 255, 255, 0.15); outline: none; cursor: pointer;
    }
    .pd-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--pd-accent); border: 2px solid #ffffff;
      box-shadow: 0 0 10px var(--pd-primary); cursor: pointer; transition: transform 0.1s ease;
    }
    .pd-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
    .pd-footer { text-align: center; margin-top: 30px; font-size: 0.8rem; color: #707090; }
  </style>
</head>
<body>
  <div id="radio-esperanza-podcasts"></div>
  <div class="pd-footer">© 2026 Radio Esperanza. Todos los derechos reservados.</div>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['c', 'u', 's', 'a', 'p'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const contenedor = document.getElementById('radio-esperanza-podcasts');
      if (!contenedor) return;

      let datosPodcastsGeneral = [];
      let currentAudio = null;
      let currentPlayingId = null;
      window.isDraggingSlider = {};

      const formatearTiempo = (segundos) => {
        if (!segundos || isNaN(segundos)) return "00:00";
        const min = Math.floor(segundos / 60);
        const seg = Math.floor(segundos % 60);
        return `${min}:${seg < 10 ? '0' : ''}${seg}`;
      };

      const cargarPodcastsGeneral = async () => {
        contenedor.innerHTML = '<div class="pd-loading">Cargando podcasts... ⏳</div>';
        try {
          const url = `podcasts/podcasts.json?v=${new Date().getTime()}`;
          const respuesta = await fetch(url);
          if (!respuesta.ok) throw new Error(`HTTP: ${respuesta.status}`);
          const json = await respuesta.json();
          datosPodcastsGeneral = json.podcasts || [];
          if (datosPodcastsGeneral.length === 0) mostrarProximamente();
          else mostrarListaPodcasts();
        } catch (error) {
          contenedor.innerHTML = `<div class="pd-error">⚠️ No pudimos cargar los podcasts.</div>`;
        }
      };

      const mostrarProximamente = () => {
        contenedor.innerHTML = `<div class="pd-proximamente"><div class="pd-prox-icon">🎙️</div><h2>PRÓXIMAMENTE</h2></div>`;
      };

      const mostrarListaPodcasts = () => {
        detenerAudioActual();
        contenedor.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'pd-grid';

        datosPodcastsGeneral.forEach((podcast, index) => {
          grid.innerHTML += `
            <div class="pd-card">
              <div class="pd-card-img-container">
                <img src="${podcast.imagen}" class="pd-card-img">
                <span class="pd-badge">${podcast.categoria}</span>
              </div>
              <div class="pd-card-content">
                <h3 class="pd-card-title">${podcast.titulo}</h3>
                <div class="pd-card-desc">${podcast.descripcion}</div>
                <div class="pd-card-meta"><span>👤 ${podcast.autor}</span><span>🎙 ${podcast.episodios_count || 0} eps</span></div>
                <button class="pd-btn" onclick="verPodcast(${index})">Ver podcast</button>
              </div>
            </div>`;
        });
        contenedor.appendChild(grid);
      };

      window.verPodcast = async (index) => {
        detenerAudioActual();
        const pGeneral = datosPodcastsGeneral[index];
        contenedor.innerHTML = '<div class="pd-loading">Cargando episodios... ⏳</div>';

        try {
          const urlSubfolder = `${pGeneral.info_url}?v=${new Date().getTime()}`;
          const res = await fetch(urlSubfolder);
          if (!res.ok) throw new Error(`HTTP: ${res.status}`);
          const podcastData = await res.json();
          const episodios = podcastData.episodios || [];

          let html = `
            <button class="pd-back-btn" onclick="document.dispatchEvent(new Event('volverPodcasts'))">← Volver</button>
            <div class="pd-header">
              <img src="${podcastData.imagen}" class="pd-header-img">
              <h1>${podcastData.titulo}</h1>
              <div class="pd-header-desc">${podcastData.descripcion}</div>
              <div class="pd-header-meta">👤 ${podcastData.autor} • 📅 ${podcastData.fecha}</div>
            </div>
            <h2 class="pd-episodes-title">EPISODIOS (${episodios.length})</h2><div class="pd-episodes-list">`;

          if (episodios.length === 0) {
            html += `<p class="pd-loading">Aún no hay episodios.</p>`;
          } else {
            episodios.forEach((ep) => {
              const uniqueId = `${podcastData.id}-${ep.id}`;
              window.isDraggingSlider[uniqueId] = false;

              html += `
                <div class="pd-episode">
                  <div class="pd-ep-info">
                    <h3 class="pd-ep-title">${ep.titulo}</h3><span class="pd-ep-date">📅 ${ep.fecha}</span>
                  </div>
                  <p class="pd-ep-desc">${ep.descripcion}</p>
                  
                  <audio id="audio-${uniqueId}" preload="none" data-src="${ep.archivo}"></audio>
                  
                  <div class="pd-liquid-player">
                    <div class="pd-player-controls">
                      <button class="pd-glass-btn" onclick="rewindAudio('${uniqueId}')">↺10</button>
                      <button class="pd-glass-btn pd-glass-btn-play" id="btn-play-${uniqueId}" onclick="togglePlay('${uniqueId}')">▶</button>
                      <button class="pd-glass-btn" onclick="forwardAudio('${uniqueId}')">10↻</button>
                    </div>

                    <div class="pd-progress-container">
                      <span class="pd-time-display" id="time-curr-${uniqueId}">00:00</span>
                      <input type="range" class="pd-slider" id="slider-${uniqueId}" value="0" min="0" max="100" 
                        onmousedown="startDrag('${uniqueId}')" 
                        ontouchstart="startDrag('${uniqueId}')"
                        oninput="updateVisualTime('${uniqueId}', this.value)" 
                        onchange="seekAudio('${uniqueId}', this.value)">
                      <span class="pd-time-display" id="time-dur-${uniqueId}">--:--</span>
                    </div>
                  </div>
                </div>`;
            });
          }
          contenedor.innerHTML = html + `</div>`;
        } catch (err) {
          contenedor.innerHTML = `<button class="pd-back-btn" onclick="document.dispatchEvent(new Event('volverPodcasts'))">← Volver</button><div class="pd-error">⚠️ Error interno.</div>`;
        }
      };

      const detenerAudioActual = () => {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        if (currentPlayingId) {
          const btn = document.getElementById(`btn-play-${currentPlayingId}`);
          if (btn) btn.innerHTML = '▶';
          currentPlayingId = null;
        }
      };

      window.startDrag = (id) => { window.isDraggingSlider[id] = true; };

      window.updateVisualTime = (id, pct) => {
        window.isDraggingSlider[id] = true;
        const audio = document.getElementById(`audio-${id}`);
        const currSpan = document.getElementById(`time-curr-${id}`);
        if (audio && audio.duration) {
          currSpan.innerText = formatearTiempo((pct / 100) * audio.duration);
        }
      };

      window.seekAudio = (id, pct) => {
        const audio = document.getElementById(`audio-${id}`);
        if (audio && audio.readyState > 0 && audio.duration) {
          audio.currentTime = (pct / 100) * audio.duration;
        }
        setTimeout(() => { window.isDraggingSlider[id] = false; }, 150);
      };

      window.rewindAudio = (id) => {
        const audio = document.getElementById(`audio-${id}`);
        if (audio && audio.readyState > 0) {
          audio.currentTime = Math.max(0, audio.currentTime - 10);
        }
      };

      window.forwardAudio = (id) => {
        const audio = document.getElementById(`audio-${id}`);
        if (audio && audio.readyState > 0 && audio.duration) {
          audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        }
      };

      window.togglePlay = (id) => {
        const audio = document.getElementById(`audio-${id}`);
        const btn = document.getElementById(`btn-play-${id}`);
        const slider = document.getElementById(`slider-${id}`);
        const spanCurr = document.getElementById(`time-curr-${id}`);
        const spanDur = document.getElementById(`time-dur-${id}`);
        if (!audio) return;

        if (currentPlayingId && currentPlayingId !== id) detenerAudioActual();

        if (!audio.src || audio.src === window.location.href) {
          audio.src = audio.getAttribute('data-src');
          audio.load();
        }

        if (audio.paused) {
          const savedTime = localStorage.getItem(`podcast_pos_${id}`);
          if (savedTime && audio.currentTime < 1) {
            if (audio.readyState >= 1) {
              audio.currentTime = parseFloat(savedTime);
            } else {
              audio.addEventListener('loadedmetadata', function restorePos() {
                audio.currentTime = parseFloat(savedTime);
                audio.removeEventListener('loadedmetadata', restorePos);
              });
            }
          }

          audio.play().then(() => {
            btn.innerHTML = '❚❚';
            currentAudio = audio;
            currentPlayingId = id;
          }).catch(e => console.log(e));

        } else {
          audio.pause();
          btn.innerHTML = '▶';
        }

        audio.ontimeupdate = () => {
          if (!audio.duration) return;
          if (!window.isDraggingSlider[id]) {
            slider.value = (audio.currentTime / audio.duration) * 100;
            spanCurr.innerText = formatearTiempo(audio.currentTime);
          }
          localStorage.setItem(`podcast_pos_${id}`, audio.currentTime);
        };

        audio.onloadedmetadata = () => { spanDur.innerText = formatearTiempo(audio.duration); };
        audio.onended = () => {
          btn.innerHTML = '▶'; slider.value = 0; spanCurr.innerText = '00:00';
          localStorage.removeItem(`podcast_pos_${id}`);
        };
      };

      document.addEventListener('volverPodcasts', mostrarListaPodcasts);
      cargarPodcastsGeneral();
    });
  </script>
</body>
</html>
