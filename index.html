<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Esperanza</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading-screen">
        <div class="loader-logo">BIENVENIDO!</div>
        <div class="loader-spinner"></div>
    </div>

    <div class="desktop-background">
        <div class="bg-animation"></div>
        <div class="desktop-logo-container" id="logo-trigger" style="cursor: pointer;"></div>
    </div>

    <main id="desktop-area"></main>

    <div id="start-menu" class="hidden">
        <div class="start-header">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 50'%3E%3Cpath d='M20 35 A15 15 0 0 1 20 15 M15 40 A22 22 0 0 1 15 10 M25 30 A8 8 0 0 1 25 20' fill='none' stroke='%239000FF' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='30' cy='25' r='4' fill='%239000FF'/%3E%3Ctext x='45' y='32' font-family='sans-serif' font-size='20' font-weight='bold' fill='%23ffffff'%3ERADIO%3C/text%3E%3Ctext x='115' y='32' font-family='sans-serif' font-size='20' font-weight='bold' fill='%239000FF'%3EESPERANZA%3C/text%3E%3C/svg%3E" alt="Logo Menú" class="menu-logo" draggable="false">
            <input type="text" id="app-search" placeholder="Buscar aplicación...">
        </div>
        <div id="start-grid" class="app-grid"></div>
    </div>

    <nav id="taskbar">
        <button id="btn-start" class="taskbar-btn" title="Inicio">
            <span class="icon">⌂</span>
        </button>
        <div id="taskbar-apps"></div>
        <div id="taskbar-clock"></div>
    </nav>

    <script src="script.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Caché activado correctamente'))
                    .catch(err => console.error('Error al iniciar caché:', err));
                
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        window.location.reload();
                    }
                });
            });
        }
    </script>
</body>
</html>
