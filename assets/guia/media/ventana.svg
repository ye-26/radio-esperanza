<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 480" role="img" aria-labelledby="title desc">
<title id="title">Controles de la ventana Sintonizar</title><desc id="desc">Se abre Sintonizar desde Inicio, se amplía y restaura con los iconos reales, se minimiza, se recupera desde la barra de tareas y se cierra. El ciclo termina en el mismo escritorio vacío en que comenzó.</desc>
<defs>
  <linearGradient id="taskbar" x2="0" y2="1"><stop stop-color="#4b572b" stop-opacity=".9"/><stop offset=".55" stop-color="#303329" stop-opacity=".84"/><stop offset="1" stop-color="#5a642b" stop-opacity=".94"/></linearGradient>
  <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#252b3b" stop-opacity=".91"/><stop offset=".55" stop-color="#17232c" stop-opacity=".84"/><stop offset="1" stop-color="#525248" stop-opacity=".86"/></linearGradient>
  <linearGradient id="titlebar" x2="1"><stop stop-color="#252335"/><stop offset="1" stop-color="#171b28"/></linearGradient>
  <linearGradient id="purple" x2="1"><stop stop-color="#8500e9"/><stop offset="1" stop-color="#7900d6"/></linearGradient>
  <linearGradient id="green" x2="0" y2="1"><stop stop-color="#48e98a"/><stop offset="1" stop-color="#16c964"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>
  <style>
    .menu{opacity:0;animation:menuCycle 10s ease-in-out infinite}
    .normal{opacity:0;animation:normalCycle 10s linear infinite}
    .maximized{opacity:0;animation:maxCycle 10s linear infinite}
    .task-app{opacity:0;animation:taskCycle 10s linear infinite}
    .cursor{animation:cursorCycle 10s cubic-bezier(.45,0,.2,1) infinite}
    @keyframes menuCycle{0%,6%,19%,100%{opacity:0}9%,16%{opacity:1}}
    @keyframes normalCycle{0%,19%,32%,45%,58%,67%,81%,100%{opacity:0}22%,29%,48%,55%,70%,78%{opacity:1}}
    @keyframes maxCycle{0%,31%,100%{opacity:0}34%,42%{opacity:1}45%{opacity:0}}
    @keyframes taskCycle{0%,19%,82%,100%{opacity:0}22%,79%{opacity:1}}
    @keyframes cursorCycle{0%,4%{transform:translate(548px,150px)}8%{transform:translate(22px,446px)}12%{transform:translate(73px,247px)}20%{transform:translate(545px,34px)}33%{transform:translate(664px,31px)}45%{transform:translate(505px,34px)}59%{transform:translate(72px,451px)}69%{transform:translate(586px,34px)}84%,91%,100%{transform:translate(548px,150px)}}
    @media(prefers-reduced-motion:reduce){.menu,.maximized,.cursor{display:none}.normal{animation:none;opacity:1}.task-app{animation:none;opacity:1}}
  </style>
</defs>
